<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Bootcamp 2026 — Student Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    .card {
      width: 340px;
      padding: 32px 28px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 0.8s ease-out both;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 50px rgba(0, 0, 0, 0.55);
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #333;
      animation: pulse 2.4s ease-in-out infinite;
    }

    .role {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 0, 0.45); }
      50%      { box-shadow: 0 0 0 10px rgba(255, 210, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">DK</div>
    <h1>&lt;Yusof&gt;</h1>
    <div class="role">Student — DevOps Bootcamp 2026</div>
    <div class="badge">Cohort 2026</div>
  </div>
</body>
</html>
